###########################################################################################
# Generic: for a dataset that has no folder of its own in datasets/
# ------------------------------------------------------------------------------
# NOT VALIDATED on any dataset (validation.md here says untested). Every run with it says so
# in its preflight, its job log and config/versions.json. Check the outputs yourself.
#
# Taken from each subject's data: the b-value shells, the fODF model, the SH order's default
# and the fMRI repetition time.
# NOT taken from the data, and fixed below: the fMRI settings other than the TR. If they do
# not describe your acquisition, copy this file, change them, and name your copy in
# sbci_local.json (README.md in this folder says which lines).
# The input route is not set here either: you state it in sbci_local.json
# (workflow.distortion_corrected_input, workflow.bold_topup_fieldmaps), and nothing checks it.
###########################################################################################

DATASET_NAME=generic

# No INPUT_ROUTE: this profile is written for no particular input.

# Every non-zero shell reaches the fODF; the tensor fit uses the shell nearest b=1000 (with a
# warning when that shell is outside b = 700-1500). No DTI_BVALS / FODF_BVALS lines: no
# shells are expected.
SHELL_POLICY=all

# auto: single-shell CSD for one shell, multi-shell multi-tissue CSD for several.
FODF_MODEL=auto

# No SH_ORDER: 6 for one shell, 8 for several. Order L needs (L+1)(L+2)/2 unique gradient
# directions (6 -> 28, 8 -> 45); with fewer the fODF stage stops and names the highest order
# the data support. Set SH_ORDER in your own copy then.

# No FMRI_TR: the TR is each subject's BIDS RepetitionTime.
# FMRI_SKIP_SECONDS  leading time discarded; frames = round(seconds / TR)
# FMRI_POLYFIT       detrending polynomial order
# FMRI_STC           none: no slice-timing correction. Single-band data acquired in a known
#                    order gains from it (siemens, up, down, odd, even); multiband data does not.
# FMRI_MOTION_REGRESSORS  mcextreg: FSFast's own motion estimates
FMRI_SKIP_SECONDS=12
FMRI_POLYFIT=2
FMRI_STC=none
FMRI_MOTION_REGRESSORS=mcextreg

# N_RUNS = SET tractography repetitions, not the number of fMRI runs (one rest run is fine).
N_RUNS=4
N_SEED=1000
STEPS=75
RNG=1234
BANDWIDTH=0.005
ROIS=("4" "8" "10" "11" "12" "13" "17" "18" "26" "43" "47" "49" "50" "51" "52" "53" "54" "58" "16")

RESOLUTION=ico4
