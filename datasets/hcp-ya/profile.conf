###########################################################################################
# HCP Young Adult (HCP-YA, WU-Minn 1200 release, 3T): route `corrected_dwi_raw_bold`
# ------------------------------------------------------------------------------
# Use with, in sbci_local.json,
#   workflow.distortion_corrected_input: true   (the DWI is HCP's minimally preprocessed
#                                                T1w/Diffusion output: topup+eddy+gradient
#                                                nonlinearity, already in T1w acpc_dc space)
#   workflow.bold_topup_fieldmaps: true         (the BOLD is the unprocessed rest run; fmap/
#                                                holds its LR/RL spin-echo pair, corrected
#                                                here by topup)
# on a BIDS view of HCP's packages (README.md in this folder gives the layout):
#   T1w  T1w/T1w_acpc_dc_restore.nii.gz (0.7 mm, bias-corrected)
#   DWI  1.25 mm; b~5 + three shells at b~1000, 2000, 3000, 90 directions each
#   BOLD rfMRI_REST1_LR, TR 0.72 s, 1200 frames, multiband 8, PE LR; SpinEchoFieldMap_LR/RL
#        HCP publishes no BIDS sidecars, so the converter writes them from HCP's protocol
#        (echo spacing 0.58 ms; LR = i-, RL = i, as HCPpipelines' UnwarpDir x- / x)
# HCP's gradient-nonlinearity field (grad_dev.nii.gz) is not used.
# The lab's existing HCP-YA matrices are on the 4121-vertex grid and are not comparable.
###########################################################################################

DATASET_NAME=HCP_YA
# Input this profile is written for; the preflight stops if sbci_local.json says otherwise.
INPUT_ROUTE=corrected_dwi_raw_bold

# Every non-zero shell reaches the fODF stage, which then fits MSMT-CSD.
SHELL_POLICY=all
DTI_BVALS=(0 1000)
FODF_BVALS=(0 1000 2000 3000)

# 270 diffusion directions support order 8.
SH_ORDER=8
FODF_MODEL=auto

# FMRI_TR guards against applying these settings to another protocol. Slice-timing
# correction is off: FSFast's orders do not describe multiband acquisition. The unprocessed
# run has no BIDS *_motion.tsv, so FSFast's own motion estimates are the regressors.
# The skip mirrors the HCP lifespan profile's 6.4 s (9 frames at TR 0.72).
FMRI_TR=0.72
FMRI_SKIP_SECONDS=6.4
FMRI_POLYFIT=2
FMRI_STC=none
FMRI_MOTION_REGRESSORS=mcextreg

# N_RUNS = SET tractography repetitions, not the number of fMRI runs.
N_RUNS=4
N_SEED=1000
STEPS=75
RNG=1234
BANDWIDTH=0.005
ROIS=("4" "8" "10" "11" "12" "13" "17" "18" "26" "43" "47" "49" "50" "51" "52" "53" "54" "58" "16")

RESOLUTION=ico4
