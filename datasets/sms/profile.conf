###########################################################################################
# SMS protocol study (Siemens Prisma fit, 3 T): route `corrected_dwi_raw_bold` -- UNTESTED
# ------------------------------------------------------------------------------
# Use with, in sbci_local.json,
#   workflow.distortion_corrected_input: true   (the DWI is already corrected with topup
#                                                and eddy)
#   workflow.bold_topup_fieldmaps: true         (the BOLD is raw; fmap/ holds its AP/PA
#                                                spin-echo pair, corrected here by topup)
# on a BIDS view of the study's data (README.md in this folder gives the layout):
#   DWI  one of five protocols that differ in the simultaneous multi-slice (SMS) factor
#        (1, 3 or 6) and the in-plane acceleration (1 or 2);
#        141 volumes: 13 b0 + 26 at b=1000 + 102 at b=2000
#   BOLD rest, eyes closed: 300 frames, TR 1.09 s, multiband 6, PE j-;
#        AP/PA spin-echo pair 128x128x66, TotalReadoutTime 0.0711 s
# No subject of this study has run end to end on this release (validation.md).
###########################################################################################

DATASET_NAME=SMS
# The input route this profile is written for; the preflight stops if sbci_local.json says
# otherwise. raw: the pipeline corrects DWI and BOLD. corrected: both were corrected upstream.
# corrected_dwi_raw_bold: DWI corrected upstream, BOLD corrected here with topup.
INPUT_ROUTE=corrected_dwi_raw_bold

# Both shells reach the fODF stage, which fits MSMT-CSD (as the plain HCP/ABCD profiles).
SHELL_POLICY=all
DTI_BVALS=(0 1000)
FODF_BVALS=(0 1000 2000)

# 128 diffusion directions support order 8.
SH_ORDER=8
FODF_MODEL=auto

# FMRI_TR guards against applying these settings to another protocol. Slice-timing
# correction is off: FSFast's orders do not describe multiband acquisition. SMS has no
# BIDS *_motion.tsv, so FSFast's own motion estimates are the regressors.
FMRI_TR=1.09
FMRI_SKIP_SECONDS=12
FMRI_POLYFIT=2
FMRI_STC=none
FMRI_MOTION_REGRESSORS=mcextreg

# N_RUNS = SET tractography repetitions, not the number of fMRI runs (one rest run is fine).
N_RUNS=4
N_SEED=1000
STEPS=75
RNG=1234
BANDWIDTH=0.005
ROIS=("4" "8" "10" "11" "12" "13" "17" "18" "26" "43" "47" "49" "50" "51" "52" "53" "54" "58" "16")

RESOLUTION=ico4
